<svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Swanson Carpet and Upholstery Cleaning">
  <defs>
    <!-- Top arc: "CARPET AND UPHOLSTERY CLEANING" -->
    <path id="topArc" d="M 16,110 A 94,94 0 0,1 204,110"/>
    <!-- Bottom arc: "SERVICING THE LOWCOUNTRY" -->
    <path id="bottomArc" d="M 16,110 A 94,94 0 0,0 204,110"/>
  </defs>

  <!-- Outer navy ring -->
  <circle cx="110" cy="110" r="108" fill="#1B3A4B"/>
  <!-- Teal accent ring -->
  <circle cx="110" cy="110" r="101" fill="#4A9B8E" opacity="0.22"/>
  <!-- Cream fill -->
  <circle cx="110" cy="110" r="96" fill="#FAF7F2"/>

  <!-- Top curved text -->
  <text font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="700" fill="#1B3A4B" letter-spacing="1.8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CARPET AND UPHOLSTERY CLEANING</textPath>
  </text>

  <!-- Bottom curved text -->
  <text font-family="'Inter', Arial, sans-serif" font-size="10" font-weight="700" fill="#1B3A4B" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SERVICING THE LOWCOUNTRY</textPath>
  </text>

  <!-- SWANSON wordmark -->
  <text x="110" y="80" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="27" font-weight="700" fill="#1B3A4B" letter-spacing="4">SWANSON</text>

  <!-- Inner icon circle -->
  <circle cx="110" cy="130" r="34" fill="none" stroke="#1B3A4B" stroke-width="1.5" opacity="0.5"/>

  <!-- Teal carpet surface -->
  <rect x="86" y="150" width="48" height="9" rx="3" fill="#4A9B8E" opacity="0.3"/>
  <!-- Carpet dot texture -->
  <circle cx="92" cy="154" r="1.3" fill="#2C6E64" opacity="0.45"/>
  <circle cx="99" cy="155" r="1.3" fill="#2C6E64" opacity="0.45"/>
  <circle cx="106" cy="154" r="1.3" fill="#2C6E64" opacity="0.45"/>
  <circle cx="113" cy="155" r="1.3" fill="#2C6E64" opacity="0.45"/>
  <circle cx="120" cy="154" r="1.3" fill="#2C6E64" opacity="0.45"/>
  <circle cx="127" cy="155" r="1.3" fill="#2C6E64" opacity="0.45"/>

  <!-- Cleaning head (trapezoid) -->
  <polygon points="90,150 130,150 125,140 95,140" fill="#1B3A4B"/>
  <!-- Wand -->
  <line x1="115" y1="140" x2="130" y2="114" stroke="#1B3A4B" stroke-width="4" stroke-linecap="round"/>
  <!-- Wand grip detail -->
  <rect x="126" y="112" width="9" height="5" rx="2" fill="#1B3A4B" transform="rotate(-30 130 115)"/>

  <!-- Water drops (teal) -->
  <ellipse cx="100" cy="130" rx="4" ry="5.5" fill="#4A9B8E"/>
  <ellipse cx="108" cy="122" rx="3" ry="4" fill="#4A9B8E" opacity="0.8"/>
  <ellipse cx="95" cy="121" rx="2.5" ry="3.5" fill="#4A9B8E" opacity="0.6"/>
  <!-- Drop highlights -->
  <ellipse cx="99" cy="128" rx="1.2" ry="1.8" fill="white" opacity="0.5"/>
</svg>
